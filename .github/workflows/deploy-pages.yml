name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages. GITHUB_TOKEN is read-only by default.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A static host has no router: the prerendered page for the /games/<slug>
      # route and the game's own /games/<slug>/index.html would write to the
      # same path. Serve the game files from /play so the two never collide.
      - name: Move game files out of the route namespace
        run: mv public/games public/play

      - name: Build static site
        env:
          GITHUB_PAGES: "true"
          VITE_GAMES_DIR: play
          # Project pages are served from https://<user>.github.io/<repo>/
          PAGES_BASE: /${{ github.event.repository.name }}
        run: bun run build

      - name: Add Pages fallbacks
        run: |
          # Client-side routes that were not prerendered still boot the app.
          cp dist/client/index.html dist/client/404.html
          # Stop Pages from running the output through Jekyll (it eats _underscore dirs).
          touch dist/client/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
